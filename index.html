<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>天竺鼠小屋・試玩</title>
<style>
  :root{ --bg:#fff9e9; --card:#fffbf1; --line:#ecd6ae; --ink:#6b4226;
    --pink:#f7a8b8; --pink-d:#e07890; --mint:#c4e8c4; --mint-d:#8cc78f; --lav:#ddd2f3; --lav-d:#ab98dc; }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;min-height:100%}
  body{background:var(--bg);color:var(--ink);
    font-family:"PingFang TC","Noto Sans TC","Microsoft JhengHei","Noto Sans CJK TC","Noto Sans CJK JP",sans-serif;
    display:flex;justify-content:center;-webkit-user-select:none;user-select:none}
  .wrap{width:min(94vw,640px);padding:14px 0 24px}
  h1{margin:4px 0 10px;text-align:center;font-size:clamp(20px,5.2vw,28px);letter-spacing:2px}
  h1 small{display:block;font-size:13px;font-weight:normal;opacity:.7;letter-spacing:1px;margin-top:2px}
  .stage{position:relative;background:var(--bg);border:4px solid var(--line);border-radius:22px;
    box-shadow:0 6px 0 var(--line);overflow:hidden}
  canvas{display:block;width:100%;height:auto;aspect-ratio:4/3;touch-action:manipulation;cursor:pointer}
  .bubble{position:absolute;left:50%;top:10px;transform:translateX(-50%);background:#fff;border:3px solid var(--line);
    border-radius:16px;padding:4px 14px;font-size:clamp(14px,3.8vw,19px);white-space:nowrap;pointer-events:none;
    transition:opacity .25s;box-shadow:0 3px 0 var(--line)}
  .stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:14px 2px 4px}
  .stat{background:var(--card);border:3px solid var(--line);border-radius:14px;padding:6px 8px;font-size:13px}
  .stat b{display:block;margin-bottom:4px;font-weight:600}
  .bar{height:10px;border-radius:6px;background:#f3e6cf;overflow:hidden}
  .bar i{display:block;height:100%;border-radius:6px;transition:width .4s}
  .btns{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:12px}
  button{font:inherit;font-size:clamp(16px,4.4vw,20px);font-weight:700;color:var(--ink);border:none;border-radius:16px;
    padding:12px 4px 10px;cursor:pointer;touch-action:manipulation;transition:transform .08s,box-shadow .08s}
  button:active{transform:translateY(4px);box-shadow:0 1px 0 rgba(0,0,0,.15)!important}
  #feed{background:var(--mint);box-shadow:0 5px 0 var(--mint-d)}
  #jump{background:var(--pink);box-shadow:0 5px 0 var(--pink-d)}
  #sleep{background:var(--lav);box-shadow:0 5px 0 var(--lav-d)}
  .mute{position:absolute;right:10px;top:10px;width:44px;height:44px;padding:0;font-size:22px;border-radius:50%;background:#fff;border:3px solid var(--line);box-shadow:0 3px 0 var(--line)}
  .credit{text-align:center;font-size:11px;opacity:.55;margin-top:8px;line-height:1.5}
  .credit a{color:inherit}
  .hint{text-align:center;font-size:13px;opacity:.7;margin-top:12px}
  .swap{display:block;margin:14px auto 0;font-size:15px;font-weight:700;padding:9px 18px 8px;border-radius:999px;
    background:#fff;border:3px solid var(--line);box-shadow:0 3px 0 var(--line)}
  .picker{position:fixed;inset:0;z-index:50;background:rgba(255,249,233,.97);display:flex;justify-content:center;
    overflow-y:auto;-webkit-overflow-scrolling:touch;padding:18px 0 28px}
  .picker[hidden]{display:none}
  .pk{width:min(94vw,560px)}
  .pk h2{margin:6px 0 4px;text-align:center;font-size:clamp(20px,5.6vw,26px);letter-spacing:1px}
  .pk p{margin:0 0 14px;text-align:center;font-size:14px;opacity:.7}
  .grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
  @media (min-width:520px){.grid{grid-template-columns:repeat(3,1fr)}}
  .card{display:flex;flex-direction:column;align-items:center;gap:4px;background:var(--card);border:3px solid var(--line);
    border-radius:18px;padding:10px 6px 8px;box-shadow:0 4px 0 var(--line);font-size:17px}
  .card .pic{width:100%;height:clamp(110px,30vw,140px);display:flex;align-items:flex-end;justify-content:center}
  .card img{max-width:88%;max-height:100%;object-fit:contain}
  .card.sel{border-color:var(--pink-d);box-shadow:0 4px 0 var(--pink-d);background:#fff1f4}
  .card.sel span::after{content:" ✓"}
  .pk .close[hidden]{display:none}
  .pk .close{display:block;margin:16px auto 0;font-size:15px;padding:9px 20px 8px;border-radius:999px;background:#fff;
    border:3px solid var(--line);box-shadow:0 3px 0 var(--line)}
  .roomrow{display:flex;justify-content:center;gap:10px;flex-wrap:wrap;margin-top:14px}
  .roomrow .swap{margin:0}
  .fbtn{font-size:15px;font-weight:700;padding:9px 18px 8px;border-radius:999px;background:#ffe6de;border:3px solid #eaa48f;box-shadow:0 3px 0 #eaa48f;font-variant-numeric:tabular-nums}
  .cnt{display:inline-block;margin-left:4px;font-size:12px;padding:1px 6px;border-radius:999px;background:#fff;vertical-align:2px}
  .fm{position:fixed;inset:0;z-index:40;background:var(--bg);display:flex;justify-content:center;overflow-y:auto;-webkit-overflow-scrolling:touch}
  .fm[hidden]{display:none}
  .fmw{width:min(94vw,500px);padding:12px 0 26px}
  .fmTop{display:flex;align-items:center;gap:8px}
  .fmTop .sp{flex:1}
  .pill{font-size:15px;padding:8px 13px 7px;border-radius:999px;background:#fff;border:3px solid var(--line);box-shadow:0 3px 0 var(--line)}
  .pill.on{background:#ffe6de;border-color:#eaa48f;box-shadow:0 3px 0 #eaa48f}
  .panel{position:relative;margin-top:14px;background:#fff8e8;border:4px solid #b98250;border-radius:22px;box-shadow:0 6px 0 #9c6a3e;overflow:hidden}
  .panel[hidden]{display:none}
  .ptitle{text-align:center;font-size:clamp(24px,6.6vw,30px);font-weight:800;letter-spacing:5px;margin:16px 0 2px;color:#5a3820}
  .ring{position:relative;width:min(62vw,240px);margin:4px auto 0}
  .fm canvas{cursor:default;touch-action:manipulation}
  .ring canvas{width:100%;height:auto;aspect-ratio:1;image-rendering:pixelated;image-rendering:crisp-edges}
  .ring .rnd{position:absolute;left:0;right:0;top:61%;text-align:center;font-size:clamp(15px,4.4vw,19px);font-weight:800;letter-spacing:2px;color:#5a3820}
  .sets{display:flex;justify-content:center;gap:12px;flex-wrap:wrap;margin:8px 10px 2px;font-size:14px}
  .sets[hidden]{display:none}
  .seg{display:inline-flex;align-items:center;gap:4px}
  .seg button{font-size:14px;padding:5px 10px 4px;border-radius:10px;background:#fff;border:2px solid var(--line);box-shadow:0 2px 0 var(--line)}
  .seg button.on{background:#ffe6de;border-color:#eaa48f;box-shadow:0 2px 0 #eaa48f}
  .seg button:disabled{opacity:.45}
  .scene{position:relative;margin-top:6px}
  .scene canvas{width:100%;height:auto;aspect-ratio:800/440;display:block}
  #bCv{aspect-ratio:800/560}
  .sbub{position:absolute;background:#fff;border:3px solid #6b4226;border-radius:12px;padding:3px 12px;font-size:clamp(14px,4vw,18px);font-weight:700;white-space:nowrap;pointer-events:none;transition:opacity .25s;box-shadow:0 3px 0 rgba(107,66,38,.25)}
  .sbub::after{content:"";position:absolute;bottom:-9px;width:12px;height:12px;background:#fff;border-right:3px solid #6b4226;border-bottom:3px solid #6b4226;transform:rotate(45deg);left:var(--tail,24px)}
  .reward{position:absolute;left:50%;bottom:3%;transform:translateX(-50%);background:#fff;border:3px solid #6b4226;border-radius:12px;padding:6px 20px;font-size:clamp(17px,4.8vw,21px);font-weight:800;line-height:1.45;text-align:center;box-shadow:0 4px 0 rgba(107,66,38,.3);animation:pop .45s cubic-bezier(.3,1.6,.5,1)}
  .reward[hidden]{display:none}
  .reward small{display:block;font-size:12px;line-height:1.2;font-weight:600;opacity:.7}
  @keyframes pop{from{transform:translateX(-50%) scale(.3);opacity:0}to{transform:translateX(-50%) scale(1);opacity:1}}
  .fbar{display:flex;flex-direction:column;align-items:center;gap:8px;background:#c48a52;padding:12px 14px 16px;border-top:3px solid #a8703f}
  .bigbtn{min-width:min(56vw,220px);background:#fff1d6;border:3px solid #7a4b28;box-shadow:0 5px 0 #7a4b28;border-radius:14px;font-size:clamp(19px,5.4vw,23px);letter-spacing:4px;padding:11px 18px 9px}
  .bigbtn.warn{background:#ffd9d0}
  .link{background:none;border:none;font-size:14px;font-weight:600;color:#fff5e4;text-decoration:underline;padding:2px 8px;box-shadow:none}
  .bclock{display:block;margin:4px auto 0;width:min(38vw,150px);height:auto;aspect-ratio:30/7;image-rendering:pixelated}
  .recTop{display:flex;align-items:center;gap:6px;padding:4px 12px 0}
  .recTop img{width:34%;max-width:150px;filter:drop-shadow(0 6px 0 rgba(214,186,140,.45))}
  .cal{flex:1;background:#fff;border:3px solid #b98250;border-radius:10px;overflow:hidden;position:relative;margin-top:10px}
  .cal .ch{background:#e9a477;color:#fff;font-weight:800;text-align:center;font-size:13px;padding:7px 0 4px;letter-spacing:1px;border-bottom:3px solid #b98250}
  .cal .rings{position:absolute;top:-1px;left:0;right:0;display:flex;justify-content:space-around;padding:0 14%;pointer-events:none}
  .cal .rings i{width:5px;height:8px;background:#7a7a86;border-radius:3px}
  .cal .g{display:grid;grid-template-columns:repeat(7,1fr);gap:1px;background:#f0e2c6;padding:1px}
  .cal .g span{background:#fffdf7;aspect-ratio:1;display:flex;align-items:center;justify-content:center;font-size:10px;color:#a88866;position:relative}
  .cal .g span.wd{background:#fff3e6;font-weight:700;color:#8a6040;aspect-ratio:auto;padding:2px 0}
  .cal .g span.t{outline:2px solid #e07890;outline-offset:-2px;color:#6b4226;font-weight:800}
  .cal .g span img{width:78%;image-rendering:pixelated}
  .cal .g span b{position:absolute;right:1px;bottom:0;font-size:8px;color:#c0392b}
  .rcard{margin:12px 12px 0;background:#fff3df;border:3px solid #ecd6ae;border-radius:14px;padding:10px 8px;text-align:center;font-size:clamp(17px,4.8vw,20px);font-weight:800;line-height:1.6}
  .hearts{display:flex;justify-content:center;gap:6px;margin-top:4px}
  .hearts img{width:clamp(26px,8vw,34px);image-rendering:pixelated}
  .rcard small{display:block;font-size:12px;font-weight:600;opacity:.65;line-height:1.3;margin-top:2px}
  .inv{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:12px 12px 14px}
  .inv div{background:#fff3df;border:3px solid #ecd6ae;border-radius:12px;padding:6px 2px 4px;text-align:center;font-size:13px;font-weight:700}
  .inv img{display:block;margin:0 auto 2px;height:40px;width:auto;image-rendering:pixelated}
  .inv img.sm{image-rendering:auto}
  .cnt[hidden]{display:none}
</style>
</head>
<body>
<div class="wrap">
  <h1>🐹 天竺鼠小屋<small>摸摸牠、餵牠吃菜，看牠開心跳！</small></h1>
  <div class="stage">
    <canvas id="c" width="800" height="600" aria-label="天竺鼠"></canvas>
    <div class="bubble" id="bubble">噗噗～ 你好！</div>
    <button class="mute" id="mute" aria-label="音效開關">🔊</button>
  </div>
  <div class="stats">
    <div class="stat"><b>🥬 飽食度</b><div class="bar"><i id="barFood" style="background:#8cc78f"></i></div></div>
    <div class="stat"><b>💗 心情</b><div class="bar"><i id="barMood" style="background:#f08aa4"></i></div></div>
    <div class="stat"><b>⭐ 精神</b><div class="bar"><i id="barEnergy" style="background:#f2c25c"></i></div></div>
  </div>
  <div class="btns">
    <button id="feed">🥬 餵菜<span class="cnt" id="feedCnt" hidden></span></button>
    <button id="jump">✨ 開心跳</button>
    <button id="sleep">🌙 睡覺</button>
  </div>
  <div class="roomrow"><button class="fbtn" id="focusBtn">🍅 專心</button><button class="swap" id="swap">🐹 換一隻天竺鼠</button></div>
  <div class="hint">點一下天竺鼠可以摸摸牠喔</div>
  <div class="credit">音效：天竺鼠真實錄音，來自 Wikimedia Commons（The undertow，公有領域）<br><a href="https://commons.wikimedia.org/wiki/File:Guinea_Pig_Feeding_Wheek.ogg" target="_blank" rel="noopener">Feeding Wheek</a>・<a href="https://commons.wikimedia.org/wiki/File:Guinea_Pig_Happy.ogg" target="_blank" rel="noopener">Happy</a>・<a href="https://commons.wikimedia.org/wiki/File:Guinea_Pig_Chirping.ogg" target="_blank" rel="noopener">Chirping</a></div>
</div>
<div class="fm" id="fm" hidden role="dialog" aria-label="番茄鐘專心模式">
  <div class="fmw">
    <div class="fmTop">
      <button class="pill" id="fmBack">← 回小屋</button>
      <span class="sp"></span>
      <button class="pill on" id="tabTimer">🍅 番茄鐘</button>
      <button class="pill" id="tabRec">📅 紀錄</button>
    </div>
    <div class="panel" id="pFocus">
      <div class="ptitle" id="fTitle">番茄鐘</div>
      <div class="ring"><canvas id="ringCv" width="100" height="100"></canvas><div class="rnd" id="fRound">第 1 輪</div></div>
      <div class="sets" id="fSets">
        <span class="seg">專心 <button data-f="25">25</button><button data-f="50">50</button> 分</span>
        <span class="seg">休息 <button data-b="5">5</button><button data-b="10">10</button> 分</span>
      </div>
      <div class="scene"><canvas id="fCv" width="800" height="440"></canvas><div class="sbub" id="fBub" style="right:3%;top:5%;opacity:0;--tail:calc(100% - 60px)">…</div></div>
      <div class="fbar"><button class="bigbtn" id="fStart">開始專心</button><button class="bigbtn" id="fGive" hidden>放棄</button></div>
    </div>
    <div class="panel" id="pBreak" hidden>
      <div class="ptitle" id="bTitle">休息時間</div>
      <canvas class="bclock" id="bClock" width="30" height="7"></canvas>
      <div class="scene"><canvas id="bCv" width="800" height="560"></canvas>
        <div class="sbub" id="bBub" style="left:7%;top:6%;--tail:58px">wheek！</div>
        <div class="reward" id="bRew" hidden></div></div>
      <div class="fbar"><button class="bigbtn" id="bFeed">餵牠</button><button class="link" id="bSkip">跳過休息，開始下一輪</button></div>
    </div>
    <div class="panel" id="pRec" hidden>
      <div class="ptitle">今日紀錄</div>
      <div class="recTop"><img id="rPig" alt=""><div class="cal"><div class="rings"><i></i><i></i><i></i><i></i><i></i></div><div class="ch" id="rMonth"></div><div class="g" id="rGrid"></div></div></div>
      <div class="rcard"><div id="rToday">今天專心 0 輪</div><div id="rStreak">連續 0 天</div><div class="hearts" id="rHearts"></div><small id="rAff"></small></div>
      <div class="inv" id="rInv"></div>
    </div>
  </div>
</div>
<div class="picker" id="picker" hidden role="dialog" aria-label="選擇天竺鼠">
  <div class="pk">
    <h2>選一隻妳的天竺鼠</h2>
    <p>點一下就能帶牠回家，之後也可以再換喔</p>
    <div class="grid" id="grid"></div>
    <button class="close" id="pkClose" hidden>先不換了</button>
  </div>
</div>

// ---------- sound: real guinea pig recordings (Web Audio) ----------
const SND = (() => {
  const VOL = { wheek_feed:0.55, wheek_short1:0.5, wheek_short2:0.5, chut1:0.75, chut2:0.75, chut3:0.75, chirp_wake:0.3 };
  let ac = null, master = null, buf = {}, voices = [], last = {}, decodeLog = {}, decoding = null;
  let muted = false; try { muted = localStorage.getItem('gp-muted') === '1'; } catch(e){}
  const btn = document.getElementById('mute');
  const paint = () => { btn.textContent = muted ? '🔇' : '🔊'; btn.setAttribute('aria-pressed', String(muted)); };
  paint();
  function b64(u){ const s = atob(u.split(',')[1]); const a = new Uint8Array(s.length); for (let i = 0; i < s.length; i++) a[i] = s.charCodeAt(i); return a.buffer; }
  function unlock(){
    const AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) return Promise.resolve();
    if (!ac){
      ac = new AC(); master = ac.createGain(); master.gain.value = muted ? 0 : 1; master.connect(ac.destination);
      for (const k of Object.keys(SOUNDS)){
        decodeLog[k] = 'pending';
      }
      decoding = Promise.all(Object.keys(SOUNDS).map(k => ac.decodeAudioData(b64(SOUNDS[k]))
          .then(b => { buf[k] = b; decodeLog[k] = 'ok:' + b.duration.toFixed(2) + 's'; })
          .catch(e => { decodeLog[k] = 'fail:' + e; })));
    }
    return ac.state === 'suspended' ? ac.resume() : Promise.resolve();
  }
  // first user gesture unlocks audio (autoplay policy)
  const EVTS = ['pointerdown','touchstart','touchend','mousedown','click','keydown'];
  const first = () => {
    unlock().then(() => {
      try { const sb = ac.createBuffer(1, 1, 22050), s0 = ac.createBufferSource(); s0.buffer = sb; s0.connect(ac.destination); s0.start(0); } catch(e){}
      if (ac && ac.state === 'running') EVTS.forEach(ev => window.removeEventListener(ev, first, true));
    }).catch(()=>{});
  };
  EVTS.forEach(ev => window.addEventListener(ev, first, true));
  btn.addEventListener('click', e => {
    e.stopPropagation(); muted = !muted; paint();
    try { localStorage.setItem('gp-muted', muted ? '1' : '0'); } catch(err){}
    if (master) master.gain.value = muted ? 0 : 1;
  });
  function play(names, opt = {}){
    if (ac && !muted && decoding && !names.some(n => buf[n])){   // very first tap: play once decoded (if quick)
      const t0 = performance.now();
      decoding.then(() => { if (performance.now() - t0 < 400) play(names, opt); });
      return false;
    }
    if (!ac || muted) return false;
    if (ac.state !== 'running'){ ac.resume().then(() => { if (ac.state === 'running') play(names, opt); }).catch(()=>{}); return false; }
    const group = opt.group || names[0], now = performance.now()/1000;
    voices = voices.filter(e => e > now);
    if (last[group] && now - last[group] < (opt.cooldown ?? 0.3)) return false;
    if (voices.length >= 2) return false;               // never more than 2 voices at once
    const ready = names.filter(n => buf[n]); if (!ready.length) return false;
    const n = ready[Math.floor(Math.random()*ready.length)];
    const src = ac.createBufferSource(), g = ac.createGain();
    src.buffer = buf[n]; src.playbackRate.value = 1 + (Math.random()*2 - 1)*(opt.vary ?? 0.04);
    g.gain.value = VOL[n] ?? 0.5; src.connect(g); g.connect(master);
    src.start(); voices.push(now + src.buffer.duration/src.playbackRate.value); last[group] = now; return true;
  }
  return { play, unlock, status: () => ({ state: ac ? ac.state : 'none', muted, decode: { ...decodeLog } }) };
})();

// ---------- particles (reference art) ----------
const parts = [];
function addHeart(x, y, delay=0){ parts.push({k:'heart', x, y, age:-delay, life:1.6, sway:Math.random()*6.28, s:0.55 + Math.random()*0.35}); }
function addZ(x, y){ parts.push({k:'z', x, y, age:0, life:2.8, sway:Math.random()*6.28, s:0.55 + Math.random()*0.45}); }
function addSpark(x, y, vx, vy, kind='spark', delay=0){ parts.push({k:kind, x, y, vx, vy, age:-delay, life:0.75 + Math.random()*0.35, s: kind === 'popcorn' ? 0.45 + Math.random()*0.2 : 0.5 + Math.random()*0.6, rot:Math.random()*6.28}); }
function addCrumb(x, y){ parts.push({k:'crumb', x, y, vx:(Math.random()-.5)*90, vy:-60 - Math.random()*60, age:0, life:0.6, s:4 + Math.floor(Math.random()*2)*2}); }
function burst(x, y, n){
  for (let i = 0; i < n; i++){
    const a = Math.PI + (i/(n-1))*Math.PI, sp = 140 + Math.random()*120;
    addSpark(x + Math.cos(a)*110, y, Math.cos(a)*sp, Math.sin(a)*sp*0.9 - 40, i % 3 === 1 ? 'popcorn' : 'spark', Math.random()*0.05);
  }
}
function updateParts(dt){
  for (let i = parts.length-1; i >= 0; i--){
    const q = parts[i]; q.age += dt;
    if (q.age >= q.life){ parts.splice(i,1); continue; }
    if (q.age < 0) continue;
    if (q.k === 'heart') q.y -= 70*dt;
    else if (q.k === 'z'){ q.y -= 38*dt; q.x += 14*dt; }
    else { q.x += q.vx*dt; q.y += q.vy*dt; q.vx *= (1 - 2.2*dt); q.vy = q.vy*(1 - 2.2*dt) + (q.k === 'crumb' ? 500 : 120)*dt; }
  }
}
function drawParts(){
  for (const q of parts){
    if (q.age < 0) continue;
    const f = q.age/q.life;
    ctx.globalAlpha = f > 0.6 ? 1 - (f-0.6)/0.4 : Math.min(1, q.age*8);
    if (q.k === 'crumb'){ ctx.fillStyle = '#8fcf5c'; ctx.fillRect(Math.round(q.x), Math.round(q.y), q.s, q.s); continue; }
    const im = img[q.k];
    let s = q.s, x = q.x, rot = 0;
    if (q.k === 'heart'){ x += Math.sin(q.age*5 + q.sway)*8; s *= Math.min(1, 0.6 + q.age*3); }
    if (q.k === 'z'){ x += Math.sin(q.age*2.2 + q.sway)*8; s *= Math.min(1, 0.4 + q.age*1.5); }
    if (q.k === 'spark' || q.k === 'popcorn'){ s *= (1 - f*0.6); rot = q.rot + q.age*3; }
    ctx.save(); ctx.translate(x, q.y); ctx.rotate(rot);
    ctx.drawImage(im, -im.width*s/2, -im.height*s/2, im.width*s, im.height*s);
    ctx.restore();
  }
  ctx.globalAlpha = 1;
}

  let view = 'timer', open = false, anim = { mood:null, moodT:0, eatT:-1, eatKind:'lettuce', t0:performance.now(), bubT:0 }, giveArm = 0;

  function startFocus(){

  function feedPig(){

  function useLettuce(){ if (D.inv.lettuce > 0){ D.inv.lettuce--; saveD(); paintRoom(); return true; } return false; }

  function tick(){

  function drawPig(c, pose, cx, floor, sc, o = {}){

  function shadow(c, x, y, w, a){ c.fillStyle = 'rgba(90,50,20,' + a + ')'; c.beginPath(); c.ellipse(x, y, w, 12, 0, 0, Math.PI*2); c.fill(); }
  function drawFocusScene(t){

  function render(){

    el.rInv.innerHTML = '<div><img class="sm" src="' + IMGS.lettuce + '" alt="">生菜 ×' + D.inv.lettuce + '</div>'
      + '<div><img src="' + URL_P + '" alt="">飼料 ×' + D.inv.feed + '</div>'
      + '<div><img src="' + URL_T + '" alt="">番茄 ×' + D.total + '</div>';

  function paintRoom(){

// ---------- pose / transform per state ----------
function compute(dt){
  const T = S.time, t = S.t;
  const o = { sx:1, sy:1, lift:0, blink:false, lettuce:null, shadow:1 };
  const br = Math.sin(T*Math.PI*2/2.6);
  o.sy = 1 + 0.014*br; o.sx = 1 - 0.007*br;

  if (S.state === 'idle' || S.state === 'wake'){
    S.nextBlink -= dt;
    if (S.nextBlink <= 0 && S.state === 'idle'){ S.blinkT = 0; S.dbl = Math.random() < .25; S.nextBlink = 2.4 + Math.random()*3; }
  }
  if (S.blinkT >= 0){
    S.blinkT += dt; const b = S.blinkT;
    o.blink = b < 0.11 || (S.dbl && b > 0.22 && b < 0.33);
    if (b > (S.dbl ? 0.34 : 0.12)) S.blinkT = -1;
    if (S.state !== 'idle') { o.blink = false; S.blinkT = -1; }
  }

  switch (S.state){
    case 'pet': {
      const k = Math.min(1, t/0.15);
      const rub = Math.abs(Math.sin(t*Math.PI*2.6));
      o.sy = 1 - 0.035*k - 0.02*rub; o.sx = 1 + 0.025*k + 0.012*rub;
      if (t > PET_DUR - 0.15) setPose('idle', 0.15);
      if (t > PET_DUR){ if (S.queueJump){ S.queueJump = false; jump(); } else setState('idle'); }
      break;
    }
    case 'eat': {
      const DROP = 0.55, L = META.lettuce, em = META.eat;
      const tx = CX - em.cx*SCALE + L.x*SCALE, ty = FLOOR - em.h*SCALE + L.y*SCALE;
      if (t < DROP + 0.15){
        let y;
        if (t < DROP){ const k = t/DROP; y = lerp(-L.h*SCALE, ty, k*k); }
        else { if (!S.flags.landSnd){ S.flags.landSnd = 1; SND.play(['wheek_feed'], {cooldown:0.8}); } const k = (t - DROP)/0.15; y = ty - Math.sin(k*Math.PI)*14; }
        o.lettuce = {x:tx, y, w:L.w*SCALE, h:L.h*SCALE};
        o.sy = 1 + 0.03*Math.min(1, t/0.3); o.sx = 1 - 0.015*Math.min(1, t/0.3); // perks up
      } else {
        setPose('eat', 0.08);
        const ct = t - DROP - 0.15;
        if (ct < 3.0){
          const c = Math.sin(ct*Math.PI*2*3.2);
          o.sy = 1 - 0.012 - 0.012*c; o.sx = 1 + 0.008 + 0.006*c;
          if (!S.flags.chewSay){ S.flags.chewSay = 1; say('嚼嚼嚼…好好吃！', 3); }
          S.crumbT = (S.crumbT || 0) - dt;
          if (S.crumbT <= 0){ addCrumb(CX - 40 + Math.random()*30, FLOOR - 170); S.crumbT = 0.25 + Math.random()*0.2; }
        } else if (!S.flags.full){
          S.flags.full = 1; S.food = clamp(S.food + 25, 0, 100); say('吃飽飽了～ 💚'); addHeart(CX, 250); setPose('idle', 0.3);
        }
      }
      if (t > EAT_DUR) setState('idle');
      break;
    }
    case 'jump': {
      const A = 0.14, AIR = 0.52, LAND = 0.2, HJ = 120;
      o.sy = 1; o.sx = 1;
      if (t < A){ const k = Math.sin(t/A*Math.PI/2); o.sy = 1 - 0.12*k; o.sx = 1 + 0.08*k; }
      else if (t < A + AIR){
        setPose('jump', 0.05);
        const k = (t - A)/AIR;
        o.lift = HJ*(META.jumpK || 1)*4*k*(1-k);
        const st = k < 0.3 ? 1 - k/0.3 : (k > 0.8 ? (k-0.8)/0.2*0.5 : 0);
        o.sy = 1 + 0.10*st; o.sx = 1 - 0.06*st;
        if (!S.flags.up){ S.flags.up = 1; burst(CX, FLOOR - 10, 5); SND.play(['wheek_short1','wheek_short2'], {group:'wheek', cooldown:0.5}); }
      } else if (t < A + AIR + LAND){
        setPose('idle', 0.05);
        const k = (t - A - AIR)/LAND, sq = Math.sin((1-k)*Math.PI/2);
        o.sy = 1 - 0.14*sq; o.sx = 1 + 0.10*sq;
        if (!S.flags.land){ S.flags.land = 1; burst(CX, FLOOR - 20, 9); }
      } else {
        const k = (t - A - AIR - LAND)/(JUMP_DUR - A - AIR - LAND);
        o.sy = 1 + 0.03*Math.sin(k*Math.PI); o.sx = 1 - 0.015*Math.sin(k*Math.PI);
      }
      o.shadow = 1 - clamp(o.lift/HJ, 0, 1)*0.45;
      if (t > JUMP_DUR) setState('idle');
      break;
    }
    case 'sleep': {
      const sb = Math.sin(T*Math.PI*2/3.6);
      o.sy = 1 + 0.02*sb; o.sx = 1 - 0.008*sb;
      S.zTimer -= dt;
      if (S.zTimer <= 0 && t > 0.5){ addZ(CX + 90 + Math.random()*20, FLOOR - 190); S.zTimer = 1.0 + Math.random()*0.3; }
      S.energy = clamp(S.energy + 6*dt, 0, 100);
      break;
    }
    case 'wake': {
      const k = Math.sin(clamp(t/0.5, 0, 1)*Math.PI);
      o.sy = 1 + 0.04*k; o.sx = 1 - 0.02*k; // little stretch
      if (t > WAKE_DUR) setState('idle');
      break;
    }
  }
  return o;
}

function drawPose(name, o, alpha){
  if (!name || alpha <= 0) return;
  const key = (name === 'idle' && o.blink) ? 'idle_blink' : name;
  const im = pimg[sel][key], m = META[name];
  const w = m.w*SCALE, h = m.h*SCALE;
  ctx.save();
  ctx.globalAlpha = alpha;
  ctx.translate(CX, FLOOR - o.lift);
  ctx.scale(o.sx, o.sy);
  ctx.drawImage(im, -m.cx*SCALE, -h, w, h);
  ctx.restore();
}

let last = 0, paused = false;
function frame(now){
  if (paused) return;
  const dt = Math.min(0.05, (now - last)/1000); last = now;
  step(dt);
  requestAnimationFrame(frame);
}
function step(dt){
  S.time += dt; S.t += dt;
  S.food = clamp(S.food - dt*0.6, 0, 100);
  if (S.state !== 'sleep') S.energy = clamp(S.energy - dt*0.4, 0, 100);
  S.mood = clamp(S.mood - dt*0.3, 0, 100);
  if (S.bubbleT > 0){ S.bubbleT -= dt; if (S.bubbleT <= 0 && S.state !== 'sleep') ui.bubble.style.opacity = 0; }
  const o = compute(dt);
  if (S.fade < 1) S.fade = Math.min(1, S.fade + dt/(S.fadeDur || 0.12));
  updateParts(dt);

  ctx.imageSmoothingEnabled = false;
  ctx.drawImage(bg, 0, 0, W, H);
  // soft shadow
  const sw = (S.pose === 'sleep' ? 150 : 128)*o.shadow*o.sx;
  ctx.fillStyle = 'rgba(214,186,140,0.38)';
  ctx.beginPath(); ctx.ellipse(CX, FLOOR - 4, sw, 16*o.shadow, 0, 0, Math.PI*2); ctx.fill();

  ctx.imageSmoothingEnabled = true; ctx.imageSmoothingQuality = 'high';
  if (S.fade < 1) drawPose(S.prevPose, o, 1 - S.fade);
  drawPose(S.pose, o, S.fade < 1 ? ease(S.fade) : 1);
  if (o.lettuce){ const L = o.lettuce; ctx.drawImage(img.lettuce, L.x, L.y, L.w, L.h); }
  drawParts();

  ui.food.style.width = S.food.toFixed(0) + '%';
  ui.mood.style.width = S.mood.toFixed(0) + '%';
  ui.energy.style.width = S.energy.toFixed(0) + '%';
}
function start(){
  window.__gp = { audio: SND.status, unlockAudio: SND.unlock, pet, feed, jump, sleep, wake, step, state: () => S.state, pause(){ paused = true; }, choose, variant: () => sel, pomo: POMO, ready:true };
  POMO.tick();
  if (!hadChoice) openPicker(false);
  last = performance.now(); requestAnimationFrame(frame);
}
})();
</script>
